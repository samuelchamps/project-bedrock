name: Project Bedrock CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: project-bedrock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/setup-helm@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::163841615330:role/ProjectBedrockGitHubActionsRole
          aws-region: us-east-1
          role-session-name: ProjectBedrockGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        run: terraform plan -no-color

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const output = `#### Terraform Plan

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: terraform apply -auto-approve

      - name: Configure kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -e

          aws eks update-kubeconfig \
            --region us-east-1 \
            --name project-bedrock-cluster

          echo "Waiting for EKS API authentication to become available..."

          for i in {1..30}; do
            echo "Authentication attempt $i/30"

            if aws eks get-token \
              --region us-east-1 \
              --cluster-name project-bedrock-cluster >/tmp/eks-token.json 2>/tmp/eks-token-error; then

              if kubectl get --raw=/version >/tmp/eks-version.json 2>/tmp/kubectl-error; then
                echo "EKS authentication successful."
                cat /tmp/eks-version.json
                break
              fi
            fi

            cat /tmp/eks-token-error 2>/dev/null || true
            cat /tmp/kubectl-error 2>/dev/null || true

            if [ "$i" -eq 30 ]; then
              echo "EKS authentication failed after 30 attempts."
              exit 1
            fi

            sleep 10
          done

          echo "Current AWS identity:"
          aws sts get-caller-identity

          echo "EKS access entries:"
          aws eks list-access-entries \
            --cluster-name project-bedrock-cluster \
            --region us-east-1

          echo "Kubernetes authentication:"
          kubectl auth can-i create serviceaccounts -n kube-system

      - name: Install AWS Load Balancer Controller
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -e

          CLUSTER_NAME="project-bedrock-cluster"
          REGION="us-east-1"

          echo "========================================"
          echo "AWS LOAD BALANCER CONTROLLER"
          echo "========================================"

          VPC_ID=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)

          echo "Cluster: $CLUSTER_NAME"
          echo "Region:  $REGION"
          echo "VPC ID:  $VPC_ID"

          echo
          echo "========================================"
          echo "SERVICE ACCOUNT"
          echo "========================================"

          kubectl create serviceaccount aws-load-balancer-controller \
            -n kube-system \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system \
            -o yaml

          echo
          echo "========================================"
          echo "POD IDENTITY"
          echo "========================================"

          aws eks list-pod-identity-associations \
            --cluster-name "$CLUSTER_NAME" \
            --region "$REGION"

          echo
          echo "========================================"
          echo "HELM REPOSITORY"
          echo "========================================"

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks

          echo
          echo "========================================"
          echo "INSTALL / UPGRADE CONTROLLER"
          echo "========================================"

          set +e

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set region="$REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait \
            --timeout 10m

          HELM_EXIT=$?

          set -e

          echo
          echo "========================================"
          echo "CONTROLLER DEPLOYMENT"
          echo "========================================"

          kubectl get deployment \
            aws-load-balancer-controller \
            -n kube-system \
            -o wide || true

          echo
          echo "========================================"
          echo "CONTROLLER PODS"
          echo "========================================"

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller \
            -o wide || true

          echo
          echo "========================================"
          echo "POD DESCRIPTIONS"
          echo "========================================"

          kubectl describe pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller || true

          echo
          echo "========================================"
          echo "CONTROLLER LOGS"
          echo "========================================"

          kubectl logs \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller \
            --all-containers=true \
            --tail=200 || true

          echo
          echo "========================================"
          echo "CONTROLLER EVENTS"
          echo "========================================"

          kubectl get events \
            -n kube-system \
            --sort-by='.lastTimestamp' \
            | tail -100 || true

          echo
          echo "========================================"
          echo "HELM RESULT"
          echo "========================================"

          if [ "$HELM_EXIT" -ne 0 ]; then
            echo "AWS Load Balancer Controller installation FAILED."
            echo "The diagnostics above contain the actual failure."
            exit "$HELM_EXIT"
          fi

          echo "AWS Load Balancer Controller installed successfully."

          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=60s

          kubectl get ingressclass alb
      - name: Deploy Retail Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARE RETAIL APPLICATION"
          echo "========================================"

          kubectl create namespace retail-app \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo
          echo "========================================"
          echo "MIGRATE LEGACY KUSTOMIZE DEPLOYMENT"
          echo "========================================"

          if ! helm status retail-store -n retail-app >/dev/null 2>&1; then
            echo "No existing Helm release found."
            echo "Removing legacy UI/Catalog resources before Helm takes ownership."

            kubectl delete deployment catalog ui \
              -n retail-app \
              --ignore-not-found=true

            kubectl delete service catalog ui \
              -n retail-app \
              --ignore-not-found=true

            kubectl delete ingress retail-store \
              -n retail-app \
              --ignore-not-found=true
          else
            echo "Existing Helm release found. Legacy cleanup not required."
          fi

          echo
          echo "========================================"
          echo "DISCOVER MANAGED DATABASES"
          echo "========================================"

          CATALOG_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier project-bedrock-catalog-mysql \
            --region us-east-1 \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          ORDERS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier project-bedrock-orders-postgres \
            --region us-east-1 \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          CATALOG_SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier project-bedrock-catalog-mysql \
            --region us-east-1 \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)

          ORDERS_SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier project-bedrock-orders-postgres \
            --region us-east-1 \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)

          test -n "$CATALOG_ENDPOINT"
          test -n "$ORDERS_ENDPOINT"
          test -n "$CATALOG_SECRET_ARN"
          test -n "$ORDERS_SECRET_ARN"

          echo "Catalog RDS endpoint discovered."
          echo "Orders RDS endpoint discovered."

          echo
          echo "========================================"
          echo "RETRIEVE DATABASE CREDENTIALS"
          echo "========================================"

          CATALOG_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$CATALOG_SECRET_ARN" \
            --region us-east-1 \
            --query SecretString \
            --output text)

          ORDERS_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$ORDERS_SECRET_ARN" \
            --region us-east-1 \
            --query SecretString \
            --output text)

          CATALOG_USER=$(echo "$CATALOG_SECRET" | jq -r '.username')
          CATALOG_PASSWORD=$(echo "$CATALOG_SECRET" | jq -r '.password')

          # Catalog uses go-envconfig v0.1.1, which expands literal $ characters.
          # Escape $ as $$ so the application receives the original RDS password.
          CATALOG_PASSWORD_ESCAPED="${CATALOG_PASSWORD//\$/\$\$}"

          ORDERS_USER=$(echo "$ORDERS_SECRET" | jq -r '.username')
          ORDERS_PASSWORD=$(echo "$ORDERS_SECRET" | jq -r '.password')

          test "$CATALOG_USER" != "null"
          test "$CATALOG_PASSWORD" != "null"
          test "$ORDERS_USER" != "null"
          test "$ORDERS_PASSWORD" != "null"

          echo "Database credentials retrieved securely from AWS Secrets Manager."

          echo
          echo "========================================"
          echo "CREATE KUBERNETES DATABASE SECRETS"
          echo "========================================"

          kubectl create secret generic catalog-db \
            -n retail-app \
            --from-literal=RETAIL_CATALOG_PERSISTENCE_USER="$CATALOG_USER" \
            --from-literal=RETAIL_CATALOG_PERSISTENCE_PASSWORD="$CATALOG_PASSWORD_ESCAPED" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic orders-db \
            -n retail-app \
            --from-literal=RETAIL_ORDERS_PERSISTENCE_USERNAME="$ORDERS_USER" \
            --from-literal=RETAIL_ORDERS_PERSISTENCE_PASSWORD="$ORDERS_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          RABBITMQ_PASSWORD=$(openssl rand -hex 16)

          kubectl create secret generic orders-rabbitmq \
            -n retail-app \
            --from-literal=RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME="bedrock" \
            --from-literal=RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          unset RABBITMQ_PASSWORD

          unset CATALOG_SECRET
          unset ORDERS_SECRET
          unset CATALOG_PASSWORD
          unset CATALOG_PASSWORD_ESCAPED
          unset ORDERS_PASSWORD

          echo
          echo "========================================"
          echo "REFRESH SECRET-DEPENDENT WORKLOADS"
          echo "========================================"

          if kubectl get deployment catalog -n retail-app >/dev/null 2>&1; then
            echo "Restarting Catalog so it consumes the latest RDS secret."
            kubectl rollout restart deployment/catalog -n retail-app

            kubectl rollout status deployment/catalog \
              -n retail-app \
              --timeout=5m
          fi

          echo
          echo "========================================"
          echo "BUILD HELM DEPENDENCIES"
          echo "========================================"

          helm dependency build retail-store-sample-app/src/app/chart

          echo
          echo "========================================"
          echo "DEPLOY FULL RETAIL STORE"
          echo "========================================"

          helm upgrade --install retail-store \
            retail-store-sample-app/src/app/chart \
            --namespace retail-app \
            --create-namespace \
            -f kubernetes/retail-app/values-production.yaml \
            --set-string catalog.app.persistence.endpoint="${CATALOG_ENDPOINT}:3306" \
            --set-string orders.app.persistence.endpoint="${ORDERS_ENDPOINT}:5432" \
            --wait \
            --timeout 15m

          echo
          echo "========================================"
          echo "APPLY ALB INGRESS"
          echo "========================================"

          kubectl apply \
            -n retail-app \
            -f kubernetes/retail-app/base/ingress.yaml

      - name: Verify Retail Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          set -euo pipefail

          echo "========================================"
          echo "APPLICATION ROLLOUTS"
          echo "========================================"

          for deployment in \
            carts \
            catalog \
            checkout \
            checkout-redis \
            orders \
            ui
          do
            echo "Checking deployment: $deployment"

            kubectl rollout status \
              deployment/"$deployment" \
              -n retail-app \
              --timeout=5m
          done

          echo "Checking RabbitMQ StatefulSet"

          kubectl rollout status \
            statefulset/orders-rabbitmq \
            -n retail-app \
            --timeout=5m

          echo
          echo "========================================"
          echo "ALL RETAIL APP PODS"
          echo "========================================"

          kubectl get pods -n retail-app -o wide

          echo
          echo "========================================"
          echo "ALL RETAIL APP SERVICES"
          echo "========================================"

          kubectl get services -n retail-app

          echo
          echo "========================================"
          echo "VERIFY MANAGED DATABASE ARCHITECTURE"
          echo "========================================"

          DB_PODS=$(kubectl get pods \
            -n retail-app \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
            | grep -Ei 'mysql|postgres|dynamodb' || true)

          if [ -n "$DB_PODS" ]; then
            echo "ERROR: In-cluster managed database replacement detected:"
            echo "$DB_PODS"
            exit 1
          fi

          echo "No MySQL, PostgreSQL, or DynamoDB database pods found in-cluster."
          echo "Managed AWS data-layer validation passed."

          echo
          echo "========================================"
          echo "INGRESS"
          echo "========================================"

          kubectl get ingress -n retail-app

          echo
          echo "========================================"
          echo "WAIT FOR ALB"
          echo "========================================"

          for i in {1..60}; do
            ADDRESS=$(kubectl get ingress retail-store \
              -n retail-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ADDRESS" ]; then
              echo "ALB hostname: $ADDRESS"

              echo
              echo "========================================"
              echo "HTTP TEST"
              echo "========================================"

              for j in {1..30}; do
                HTTP_CODE=$(curl \
                  -s \
                  -o /dev/null \
                  -w '%{http_code}' \
                  "http://$ADDRESS/" || true)

                echo "HTTP attempt $j/30: $HTTP_CODE"

                if [ "$HTTP_CODE" = "200" ]; then
                  echo "Retail Store returned HTTP 200."
                  exit 0
                fi

                sleep 10
              done

              echo "ERROR: ALB exists but application did not return HTTP 200."
              exit 1
            fi

            echo "Waiting for ALB... ($i/60)"
            sleep 10
          done

          echo "ERROR: ALB address was not created."

          kubectl describe ingress retail-store -n retail-app
          exit 1
