name: Project Bedrock CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: project-bedrock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/setup-helm@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::163841615330:role/ProjectBedrockGitHubActionsRole
          aws-region: us-east-1
          role-session-name: ProjectBedrockGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        run: terraform plan -no-color

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const output = `#### Terraform Plan

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: terraform apply -auto-approve

      - name: Configure kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name project-bedrock-cluster

      - name: Install AWS Load Balancer Controller
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          kubectl create serviceaccount aws-load-balancer-controller \
            -n kube-system \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=project-bedrock-cluster \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --version 1.14.0 \
            --wait \
            --timeout 10m

      - name: Verify Load Balancer Controller
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          kubectl rollout status \
            deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=5m

          kubectl get ingressclass alb

      - name: Deploy Retail Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          kubectl apply -k kubernetes/retail-app/overlays/production

      - name: Verify Retail Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          kubectl rollout status deployment/catalog \
            -n retail-app \
            --timeout=5m

          kubectl rollout status deployment/ui \
            -n retail-app \
            --timeout=5m

          echo "========================================"
          echo "RETAIL APP"
          echo "========================================"
          kubectl get pods -n retail-app

          echo
          echo "========================================"
          echo "INGRESS"
          echo "========================================"
          kubectl get ingress -n retail-app

          echo
          echo "========================================"
          echo "ALB ADDRESS"
          echo "========================================"

          for i in {1..60}; do
            ADDRESS=$(kubectl get ingress retail-store \
              -n retail-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ADDRESS" ]; then
              echo "$ADDRESS"
              exit 0
            fi

            echo "Waiting for ALB... ($i/60)"
            sleep 10
          done

          echo "ERROR: ALB address was not created."
          kubectl describe ingress retail-store -n retail-app
          exit 1
